[project]
name = "course-project-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Evgenii_Lobachev",email = "lobachev9614@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
isort = "^7.0.0"
black = "^25.9.0"


[tool.poetry.group.dev.dependencies]
requests = "^2.32.5"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
pandas-stubs = "^2.3.2.250926"
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
python-dotenv = "^1.2.1"
python-dateutil = "^2.9.0.post0"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ['.venv','tests', 'idea', 'git', '.coverage',]

[tool.isort]
profile = "black"
line_length = 119

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
      \.idea
      \.venv
      \.coverage
  )/
)
'''